# BrewStation Docker Compose
# Services: app + postgres + nginx

version: "3.8"

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  db:
    image: postgres:15-alpine
    container_name: brewstation-db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${NEON_DATABASE:-brewstation}
      POSTGRES_USER: ${NEON_USER:-brewstation}
      POSTGRES_PASSWORD: ${NEON_PASSWORD:-brewstation_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NEON_USER:-brewstation}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brewstation-net

  # ============================================================
  # Redis (optional - for sessions/caching)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: brewstation-redis
    restart: unless-stopped
    profiles:
      - with-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - brewstation-net

  # ============================================================
  # BrewStation Application
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brewstation-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${NEON_USER:-brewstation}:${NEON_PASSWORD:-brewstation_secret}@db:5432/${NEON_DATABASE:-brewstation}
      DEBUG: "False"
      FLASK_ENV: PRD
      HOST: 0.0.0.0
      PORT: 5000
    volumes:
      - brewstation_uploads:/opt/brewstation/src/uploads
      - brewstation_logs:/opt/brewstation/logs
      - brewstation_instance:/opt/brewstation/instance
      - brewstation_configs:/opt/brewstation/src/plugins/plugin_device_manager/data/devices
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - brewstation-net

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: brewstation-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/brewstation_docker.conf:/etc/nginx/conf.d/default.conf:ro
      - brewstation_static:/opt/brewstation/static:ro
      - brewstation_certbot:/etc/letsencrypt
      - brewstation_certbot_www:/var/www/certbot
    networks:
      - brewstation-net

  # ============================================================
  # Certbot (SSL - manual run: docker compose run certbot)
  # ============================================================
  certbot:
    image: certbot/certbot
    container_name: brewstation-certbot
    profiles:
      - certbot
    volumes:
      - brewstation_certbot:/etc/letsencrypt
      - brewstation_certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do sleep 12h & wait $$!; certbot renew; done"]

volumes:
  postgres_data:
  redis_data:
  brewstation_uploads:
  brewstation_logs:
  brewstation_instance:
  brewstation_configs:
  brewstation_static:
  brewstation_certbot:
  brewstation_certbot_www:

networks:
  brewstation-net:
    driver: bridge
