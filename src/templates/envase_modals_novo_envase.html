<!-- Modal Envase -->
<div class="modal fade" id="modalEnvase" tabindex="-1" aria-labelledby="modalEnvaseLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalEnvaseTitulo">Novo Envase</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="formEnvase">
                    <input type="hidden" id="envaseId" name="envase_id">
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="selectLote" class="form-label">Lote *</label>
                                <select class="form-select" id="selectLote"  name="lote" required>
                                    <option value="">Selecione um lote</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="quantidadeLitros" class="form-label">Quantidade (Litros) *</label>
                                <input type="number" step="0.1" class="form-control" id="quantidadeLitros" required>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="dataEnvase" class="form-label">Data do Envase *</label>
                                <input type="date" class="form-control" id="dataEnvase" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="tipoEnvase" class="form-label">Tipo de Envase</label>
                                <select class="form-select" id="tipoEnvase">
                                    <option value="completo">Completo</option>
                                    <option value="parcial">Parcial</option>
                                    <option value="teste">Teste</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="statusEnvase" class="form-label">Status</label>
                        <select class="form-select" id="statusEnvase">
                            <option value="planejado">Planejado</option>
                            <option value="em_andamento">Em Andamento</option>
                            <option value="concluido">Concluído</option>
                            <option value="cancelado">Cancelado</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label for="observacoesEnvase" class="form-label">Observações</label>
                        <textarea class="form-control" id="observacoesEnvase" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="salvarEnvase()">Salvar Envase</button>
            </div>
        </div>
    </div>
</div>
