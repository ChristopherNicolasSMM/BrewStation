[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Monitor configuration
monitor_speed = 115200
monitor_filters = default

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3

; Libraries
lib_deps = 
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3

; Upload settings
upload_speed = 921600

; Filesystem
board_build.filesystem = spiffs
board_build.spiffs.size = 64k
