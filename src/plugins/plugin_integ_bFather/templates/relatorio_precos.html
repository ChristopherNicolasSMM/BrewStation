{% extends "base.html" %}

{% block title %}Relatório de Preços - BrewStation{% endblock %}

{% block content %}
<div class="pagetitle">
    <h1>Relatório de Preços</h1>
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('web.index') }}">Home</a></li>
            <li class="breadcrumb-item">Relatórios</li>
            <li class="breadcrumb-item active">Preços</li>
        </ol>
    </nav>
</div><!-- End Page Title -->

<section class="section">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Filtros do Relatório</h5>
                    
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="select-receita" class="form-label">Selecionar Receita</label>
                            <select id="select-receita" name="receita" class="form-select">
                                <option value="todas">Todas as receitas</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="data-inicio" class="form-label">Data Início</label>
                            <input type="date" id="data-inicio" name="data_inicio" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label for="data-fim" class="form-label">Data Fim</label>
                            <input type="date" id="data-fim" name="data_fim" class="form-control">
                        </div>
                    </div>
                    
                    <div class="text-center">
                        <button id="aplicar-filtros" class="btn btn-primary">Aplicar Filtros</button>
                        <button id="limpar-filtros" class="btn btn-secondary">Limpar</button>
                        <button id="exportar-excel" class="btn btn-success">Exportar Excel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Resultados</h5>
                    <div class="table-responsive">
                        <table id="tabela-precos" class="table table-striped table-bordered">
                            <thead>
                                <tr>
                                    <th>Receita</th>
                                    <th>Data</th>
                                    <th>Custo Total</th>
                                    <th>Custo por Litro</th>
                                    <th>Ingredientes</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="5" class="text-center">Carregando dados...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tabelaBody = document.querySelector('#tabela-precos tbody');
    const selectReceita = document.getElementById('select-receita');

    async function carregarReceitas() {
        try {
            const response = await fetch('/api/receitas?per_page=1000');
            const data = await response.json();
            (data.receitas || []).forEach(receita => {
                const option = document.createElement('option');
                option.value = receita.id;
                option.textContent = receita.nome;
                selectReceita.appendChild(option);
            });
        } catch (error) {
            console.error('Erro ao carregar receitas:', error);
        }
    }

    function filtros() {
        const params = new URLSearchParams();
        if (selectReceita.value && selectReceita.value !== 'todas') params.append('receita_id', selectReceita.value);
        if (document.getElementById('data-inicio').value) params.append('data_inicio', document.getElementById('data-inicio').value);
        if (document.getElementById('data-fim').value) params.append('data_fim', document.getElementById('data-fim').value);
        return params;
    }

    async function carregarRelatorio() {
        tabelaBody.innerHTML = '<tr><td colspan="5" class="text-center">Carregando dados...</td></tr>';
        try {
            const response = await fetch(`/api/relatorios/precos?${filtros().toString()}`);
            const data = await response.json();
            const registros = data.registros || [];
            if (!registros.length) {
                tabelaBody.innerHTML = '<tr><td colspan="5" class="text-center">Nenhum registro encontrado.</td></tr>';
                return;
            }
            tabelaBody.innerHTML = registros.map(item => `
                <tr>
                    <td>${item.receita_nome || '-'}</td>
                    <td>${item.data_calculo ? new Date(item.data_calculo).toLocaleString('pt-BR') : '-'}</td>
                    <td>R$ ${(item.custo_total || 0).toFixed(2)}</td>
                    <td>R$ ${(item.custo_por_litro || 0).toFixed(2)}</td>
                    <td>${item.ingredientes_resumo || '-'}</td>
                </tr>
            `).join('');
        } catch (error) {
            console.error('Erro ao carregar relatório:', error);
            tabelaBody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">Erro ao carregar relatório.</td></tr>';
        }
    }

    document.getElementById('aplicar-filtros').addEventListener('click', carregarRelatorio);
    document.getElementById('limpar-filtros').addEventListener('click', () => {
        selectReceita.value = 'todas';
        document.getElementById('data-inicio').value = '';
        document.getElementById('data-fim').value = '';
        carregarRelatorio();
    });
    document.getElementById('exportar-excel').addEventListener('click', () => {
        window.location.href = `/api/relatorios/precos/exportar?${filtros().toString()}`;
    });

    carregarReceitas().then(carregarRelatorio);
});
</script>
{% endblock %}
