{% extends "base.html" %}

{% block title %}Relatório de Preços - BrewStation{% endblock %}

{% block content %}
<div class="pagetitle">
    <h1>Relatório de Preços</h1>
    <nav>
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('web.index') }}">Home</a></li>
            <li class="breadcrumb-item">Relatórios</li>
            <li class="breadcrumb-item active">Preços</li>
        </ol>
    </nav>
</div><!-- End Page Title -->

<section class="section">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Filtros do Relatório</h5>
                    
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="select-receita" class="form-label">Selecionar Receita</label>
                            <select id="select-receita" name="receita" class="form-select">
                                <option value="todas">Todas as receitas</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="data-inicio" class="form-label">Data Início</label>
                            <input type="date" id="data-inicio" name="data_inicio" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label for="data-fim" class="form-label">Data Fim</label>
                            <input type="date" id="data-fim" name="data_fim" class="form-control">
                        </div>
                    </div>
                    
                    <div class="text-center">
                        <button id="aplicar-filtros" class="btn btn-primary">Aplicar Filtros</button>
                        <button id="limpar-filtros" class="btn btn-secondary">Limpar</button>
                        <button id="exportar-excel" class="btn btn-success">Exportar Excel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Resultados</h5>
                    <div class="table-responsive">
                        <table id="tabela-precos" class="table table-striped table-bordered">
                            <thead>
                                <tr>
                                    <th>Receita</th>
                                    <th>Data</th>
                                    <th>Custo Total</th>
                                    <th>Custo por Litro</th>
                                    <th>Ingredientes</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="5" class="text-center">Carregando dados...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Implementar lógica de carregamento de dados
    console.log('Relatório de Preços carregado');
});
</script>
{% endblock %}
