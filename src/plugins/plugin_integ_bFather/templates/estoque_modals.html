<!-- Modal Movimentação Estoque -->
<div class="modal fade" id="modalMovimentacao" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Nova Movimentação de Estoque</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formMovimentacao">
                    <input type="hidden" id="movimentacaoId">
                    <input type="hidden" id="tipoIngrediente" name="tipo_ingrediente">

                    <div class="mb-3">
                        <label for="ingredienteSelect" class="form-label">Ingrediente *</label>
                        <select class="form-select" id="ingredienteSelect" required>
                            <option value="">Selecione um ingrediente</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="tipoMovimentacao" class="form-label">Tipo *</label>
                                <select class="form-select" id="tipoMovimentacao" required>
                                    <option value="">Selecione</option>
                                    <option value="entrada">Entrada</option>
                                    <option value="saida">Saída</option>
                                    <option value="ajuste">Ajuste</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="quantidade" class="form-label">Quantidade *</label>
                                <input type="number" step="0.001" class="form-control" id="quantidade" required>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="unidadeMedida" class="form-label">Unidade de Medida *</label>
                                <select class="form-select" id="unidadeMedida" required>
                                    <option value="kg">kg</option>
                                    <option value="g">g</option>
                                    <option value="L">L</option>
                                    <option value="ml">ml</option>
                                    <option value="un">unidades</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="custoUnitario" class="form-label">Custo Unitário (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="custoUnitario">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="loteFornecedor" class="form-label">Lote do Fornecedor</label>
                                <input type="text" class="form-control" id="loteFornecedor">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="dataValidade" class="form-label">Data de Validade</label>
                                <input type="date" class="form-control" id="dataValidade">
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="observacoesMovimentacao" class="form-label">Observações</label>
                        <textarea class="form-control" id="observacoesMovimentacao" rows="3"></textarea>
                    </div>
                    <div class="alert alert-info" id="infoCustoTotal">
                        <strong>Custo Total:</strong> <span id="custoTotalCalculado">R$ 0,00</span>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="sistemaEstoque.salvarMovimentacao()">Salvar
                    Movimentação</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Custo Produção -->
<div class="modal fade" id="modalCustoProducao" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Custo de Produção</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="formCustoProducao">
                    <input type="hidden" id="custoProducaoId">
                    <input type="hidden" id="custoProducaoLoteId">

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Lote</label>
                                <input type="text" class="form-control" id="custoProducaoLoteNome" readonly>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="quantidadeProduzida" class="form-label">Quantidade Produzida (L)</label>
                                <input type="number" step="0.1" class="form-control" id="quantidadeProduzida">
                            </div>
                        </div>
                    </div>

                    <h6 class="mt-4">Custos Diretos</h6>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="custoIngredientes" class="form-label">Ingredientes (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="custoIngredientes">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="custoEmbalagens" class="form-label">Embalagens (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="custoEmbalagens">
                            </div>
                        </div>
                    </div>

                    <h6 class="mt-4">Custos Indiretos</h6>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="custoOperacional" class="form-label">Operacional (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="custoOperacional">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="custoMaoObra" class="form-label">Mão de Obra (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="custoMaoObra">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="custoDepreciacao" class="form-label">Depreciação (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="custoDepreciacao">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="margemLucro" class="form-label">Margem de Lucro (%)</label>
                                <input type="number" step="0.1" class="form-control" id="margemLucro" value="100">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Custo Total (R$)</label>
                                <input type="text" class="form-control" id="custoTotalCalculado" readonly>
                            </div>
                        </div>
                    </div>

                    <div class="alert alert-success">
                        <div class="row">
                            <div class="col-md-6">
                                <strong>Custo por Litro:</strong> <span id="custoPorLitroCalculado">R$ 0,00</span>
                            </div>
                            <div class="col-md-6">
                                <strong>Preço de Venda Sugerido:</strong> <span id="precoVendaSugerido">R$ 0,00</span>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" onclick="sistemaEstoque.salvarCustoProducao()">Salvar
                    Custo</button>
            </div>
        </div>
    </div>
</div>
