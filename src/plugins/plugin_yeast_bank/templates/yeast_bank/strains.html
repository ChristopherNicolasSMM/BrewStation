{% extends "base.html" %}
{% block title %}Yeast Bank - Cepas{% endblock %}

{% block content %}
<div class="pagetitle">
  <h1>Cepas</h1>
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="{{ url_for('web.index') }}">Home</a></li>
      <li class="breadcrumb-item"><a href="{{ url_for('plugin_yeast_bank_web.dashboard') }}">Yeast Bank</a></li>
      <li class="breadcrumb-item active">Cepas</li>
    </ol>
  </nav>
</div>

<section class="section">
  <div class="row">
    <div class="col-lg-12">

      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Lista de Cepas</h5>

          <!-- Toolbar -->
          <div class="toolbar mb-3 d-flex flex-wrap gap-2">
            <button class="btn btn-primary" id="btnNewStrain" type="button">
              <i class="bi bi-plus-circle"></i> Nova cepa
            </button>

            <button class="btn btn-primary" id="export-csv" type="button">
              <i class="bi bi-file-earmark-spreadsheet"></i> Exportar CSV
            </button>
            <button class="btn btn-success" id="export-json" type="button">
              <i class="bi bi-file-code"></i> Exportar JSON
            </button>

            <button class="btn btn-outline-secondary" id="btnImportJson" type="button">
              <i class="bi bi-upload"></i> Importar JSON
            </button>
            <input type="file" id="importJsonFile" accept="application/json" class="d-none">
          </div>

          <!-- Filtros -->
          <div class="filters mb-3">
            <div class="row g-2">
              <div class="col-md-3">
                <input type="text" class="form-control filter-input" data-column="2" placeholder="Filtrar por nome...">
              </div>
              <div class="col-md-2">
                <input type="text" class="form-control filter-input" data-column="1" placeholder="Filtrar por código...">
              </div>
              <div class="col-md-3">
                <input type="text" class="form-control filter-input" data-column="4" placeholder="Filtrar por fornecedor...">
              </div>
              <div class="col-md-2">
                <input type="text" class="form-control filter-input" data-column="3" placeholder="Filtrar por família...">
              </div>
              <div class="col-md-2">
                <button class="btn btn-outline-secondary w-100 clear-filters" type="button">
                  <i class="bi bi-x-circle"></i> Limpar
                </button>
              </div>
            </div>
          </div>

          <!-- Tabela -->
          <div class="table-responsive">
            <table class="table table-striped" id="strains-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Código</th>
                  <th>Nome</th>
                  <th>Família</th>
                  <th>Fornecedor</th>
                  <th>Status</th>
                  <th>Perda/dia (%)</th>
                  <th>Fator</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="strains-tbody"></tbody>
            </table>
          </div>

          <div class="text-muted small">API: <code>/api/yeast_bank/strains</code></div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- Modal -->
<div class="modal fade" id="strainModal" tabindex="-1" aria-labelledby="strainModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="strainModalLabel">Nova cepa</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="strainId">

        <div class="row g-2">
          <div class="col-md-4">
            <label class="form-label">Código</label>
            <input class="form-control" id="code" placeholder="ex: W34/70, US-05, WY1056">
          </div>
          <div class="col-md-8">
            <label class="form-label">Nome *</label>
            <input class="form-control" id="name" placeholder="ex: SafLager W-34/70" required>
          </div>
        </div>

        <div class="row g-2 mt-1">
          <div class="col-md-4">
            <label class="form-label">Família</label>
            <input class="form-control" id="family" placeholder="ale / lager / belgian / kveik...">
          </div>
          <div class="col-md-4">
            <label class="form-label">Fornecedor</label>
            <input class="form-control" id="supplier" placeholder="Fermentis, Lallemand, White Labs...">
          </div>
          <div class="col-md-4">
            <label class="form-label">Atalho</label>
            <input class="form-control" id="tag" placeholder="ex: clean, fruity, spicy (opcional)">
          </div>
        </div>

        <div class="row g-2 mt-2">
          <div class="col-md-3">
            <label class="form-label">Status</label>
            <select class="form-select" id="status">
              <option value="active">Ativa</option>
              <option value="watch">Sob observação</option>
              <option value="compromised">Comprometida</option>
              <option value="retired">Aposentada</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Perda/dia (%)</label>
            <input class="form-control" id="daily_viability_loss_pct" type="number" step="0.01">
          </div>
          <div class="col-md-3">
            <label class="form-label">Fator correção</label>
            <input class="form-control" id="viability_correction_factor" type="number" step="0.01">
          </div>
          <div class="col-md-3">
            <label class="form-label">Viab. inicial (%)</label>
            <input class="form-control" id="initial_reference_viability_pct" type="number" step="0.01">
          </div>
        </div>

        <div class="row g-2 mt-2">
          <div class="col-md-4">
            <label class="form-label">Modelo</label>
            <select class="form-select" id="viability_model">
              <option value="linear_decay_default">Linear</option>
              <option value="exp_decay">Exponencial</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Piso de viabilidade (%)</label>
            <input class="form-control" id="viability_floor_pct" type="number" step="0.01">
          </div>
          <div class="col-md-4">
            <label class="form-label">Notas de viabilidade</label>
            <input class="form-control" id="viability_notes">
          </div>
        </div>

        <div class="mt-2">
          <label class="form-label">Notas</label>
          <textarea class="form-control" id="notes" rows="3"></textarea>
        </div>

        <div class="alert alert-danger d-none mt-2" id="err"></div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="btnSaveStrain">Salvar</button>
      </div>

    </div>
  </div>
</div>

<link href="https://cdn.jsdelivr.net/npm/simple-datatables@latest/dist/style.css" rel="stylesheet" type="text/css">
<script src="https://cdn.jsdelivr.net/npm/simple-datatables@latest" type="text/javascript"></script>

<style>
  .toolbar { margin-bottom: 1rem; }
  .filters {
    background-color: #f8f9fa;
    padding: 1rem;
    border-radius: .375rem;
    border: 1px solid #dee2e6;
  }
  .table td, .table th { vertical-align: middle; }
</style>

<script src="/plugin/yeast_bank/static/js/strains.js"></script>
{% endblock %}
