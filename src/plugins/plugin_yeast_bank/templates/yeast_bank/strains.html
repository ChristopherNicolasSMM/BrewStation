{% extends "base.html" %}
{% block content %}
<div class="container-fluid">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h1 class="h3 mb-0">Cepas</h1>
    <button class="btn btn-primary" onclick="openCreate()">Nova cepa</button>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-sm align-middle" id="tbl">
          <thead>
            <tr>
              <th>ID</th>
              <th>Código</th>
              <th>Nome</th>
              <th>Família</th>
              <th>Fornecedor</th>
              <th style="width:120px">Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="text-muted small">API: <code>/api/yeast_bank/strains</code></div>
    </div>
  </div>
</div>

<!-- Modal simples -->
<div class="modal" tabindex="-1" id="modal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Nova cepa</h5>
        <button type="button" class="btn-close" onclick="closeModal()"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2">
          <label class="form-label">Código</label>
          <input class="form-control" id="code">
        </div>
        <div class="mb-2">
          <label class="form-label">Nome *</label>
          <input class="form-control" id="name">
        </div>
        <div class="mb-2">
          <label class="form-label">Família</label>
          <input class="form-control" id="family" placeholder="ale / lager / belgian / kveik...">
        </div>
        <div class="mb-2">
          <label class="form-label">Fornecedor</label>
          <input class="form-control" id="supplier">
        </div>
        <div class="mb-2">
          <label class="form-label">Notas</label>
          <textarea class="form-control" id="notes" rows="3"></textarea>
        </div>
        <div class="alert alert-danger d-none" id="err"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="save()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<script>
  const API = "/api/yeast_bank/strains";
  let editingId = null;

  function qs(id){ return document.getElementById(id); }

  function openCreate(){
    editingId = null;
    qs("modalTitle").innerText = "Nova cepa";
    ["code","name","family","supplier","notes"].forEach(k => qs(k).value = "");
    qs("err").classList.add("d-none");
    qs("modal").style.display = "block";
    qs("modal").classList.add("show");
  }

  function closeModal(){
    qs("modal").classList.remove("show");
    qs("modal").style.display = "none";
  }

  async function load(){
    const res = await fetch(API);
    const json = await res.json();
    const tbody = qs("tbl").querySelector("tbody");
    tbody.innerHTML = "";
    (json.items || []).forEach(item => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${item.id}</td>
        <td>${item.code || ""}</td>
        <td>${item.name || ""}</td>
        <td>${item.family || ""}</td>
        <td>${item.supplier || ""}</td>
        <td>
          <button class="btn btn-sm btn-outline-danger" onclick="del(${item.id})">Excluir</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function save(){
    const payload = {
      code: qs("code").value || null,
      name: (qs("name").value || "").trim(),
      family: qs("family").value || null,
      supplier: qs("supplier").value || null,
      notes: qs("notes").value || null
    };

    const res = await fetch(API, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if(!json.ok){
      qs("err").innerText = json.error || "Erro";
      qs("err").classList.remove("d-none");
      return;
    }
    closeModal();
    await load();
  }

  async function del(id){
    if(!confirm("Excluir esta cepa? (só se não tiver itens no banco)")) return;
    const res = await fetch(`${API}/${id}`, {method:"DELETE"});
    const json = await res.json();
    if(!json.ok){
      alert(json.error || "Erro ao excluir");
      return;
    }
    await load();
  }

  load();
</script>
{% endblock %}
