; ============================================================================
; YB Cold Node - PlatformIO
; ============================================================================
; Regras para manutenção deste arquivo:
; 1. Evitar dependências web assíncronas neste MVP. O objetivo é estabilidade.
; 2. Se trocar o board, revisar pinos no include/AppConfig.h.
; 3. O upload do portal usa a pasta /data com SPIFFS.
; 4. Antes de subir em hardware final, confirmar nível lógico do módulo de relé.
;
; Fluxo sugerido:
;   pio run
;   pio run -t upload
;   pio run -t uploadfs
;   pio device monitor -b 115200
;
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions.csv
board_build.filesystem = spiffs
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
build_type = release

lib_deps =
  milesburton/DallasTemperature@^4.0.4
  paulstoffregen/OneWire@^2.3.8
  bblanchon/ArduinoJson@^7.4.2
  arduino-libraries/LiquidCrystal@^1.0.7

build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINOJSON_USE_LONG_LONG=1

lib_extra_dirs = lib
