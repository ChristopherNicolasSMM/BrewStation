; device_manager.conf
; Configuração principal do servidor de dispositivos
; Formato: INI com seções para diferentes módulos

[general]
; Modo de operação: development ou production
environment = development
; Intervalo padrão para leitura de sensores (segundos)
polling_interval = 5
; Diretório para logs
log_dir = logs
; Nível de log: DEBUG, INFO, WARNING, ERROR
log_level = INFO

; Mapeamento de pinos GPIO
; Formato: NOME_LOGICO = NUMERO_GPIO
; Use os números GPIO (BCM), não os pinos físicos
[gpio_mapping]
; Sensores de temperatura
SENSOR_TEMP_MOSTURA = 4      ; GPIO4 - Sensor da mostura
SENSOR_TEMP_MASH = 17         ; GPIO17 - Sensor do mash
SENSOR_TEMP_AMBIENTE = 27     ; GPIO27 - Temperatura ambiente

; Sensores de nível/presença
SENSOR_NIVEL_TANQUE = 22      ; GPIO22 - Boia do tanque
SENSOR_PRESSAO = 5            ; GPIO5 - Sensor de pressão
SENSOR_FLUXO = 6              ; GPIO6 - Sensor de fluxo

; Atuadores
ATUADOR_AQUECEDOR = 23        ; GPIO23 - Controle do aquecedor
ATUADOR_BOMBA = 24            ; GPIO24 - Controle da bomba
ATUADOR_VALVULA = 25          ; GPIO25 - Controle da válvula
ATUADOR_RESISTENCIA = 16      ; GPIO16 - Resistência elétrica

; Configuração dos sensores
; Formato: nome_unico = tipo, pino_logico, intervalo_leitura
; Tipos suportados: dht22, ds18b20, gpio_input
[sensors]
; Sensor de temperatura e umidade DHT22
sensor_mostura = dht22, SENSOR_TEMP_MOSTURA, 2
sensor_ambiente = dht22, SENSOR_TEMP_AMBIENTE, 5

; Sensor DS18B20 (usar ID do dispositivo)
; Para encontrar IDs: ls /sys/bus/w1/devices/
sensor_mash = ds18b20, 28-000006d5a2e5, 3

; Sensor digital simples (contato seco)
sensor_nivel = gpio_input, SENSOR_NIVEL_TANQUE, 1

; Configuração dos atuadores
; Formato: nome_unico = tipo, pino_logico, estado_inicial
; Tipos suportados: gpio_output
[actuators]
aquecedor = gpio_output, ATUADOR_AQUECEDOR, off
bomba = gpio_output, ATUADOR_BOMBA, off
valvula = gpio_output, ATUADOR_VALVULA, off
resistencia = gpio_output, ATUADOR_RESISTENCIA, off

; Configuração MQTT
[mqtt]
; Habilitar interface MQTT (true/false)
enabled = true
; Modo de operação: 'broker' (embutido) ou 'client' (conecta a externo)
mode = client
; Configurações do broker cliente
host = localhost
port = 1883
; Credenciais (opcional)
; username = brewstation
; password = brew123
; Tópico base para todas as publicações
topic_prefix = brewstation/devices
; Qualidade de serviço (0, 1 ou 2)
qos = 1
; Manter conexão ativa (segundos)
keepalive = 60

; Configuração HTTP/REST API
[http]
; Habilitar interface HTTP (true/false)
enabled = true
; Porta do servidor
port = 5001
; Host (0.0.0.0 para acesso externo)
host = 0.0.0.0
; Chave de API para autenticação (opcional)
; api_key = sua_chave_super_secreta_123
; Habilitar CORS para acesso do frontend
cors_enabled = true
; Modo debug (não usar em produção!)
debug = false